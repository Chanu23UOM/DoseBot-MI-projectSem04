<svg viewBox="0 0 400 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI assistant illustration">
  <defs>
    <linearGradient id="cb-blob" x1="40" y1="20" x2="360" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D9488"/>
      <stop offset="0.55" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="cb-body" x1="130" y1="120" x2="270" y2="250" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D9488"/>
      <stop offset="1" stop-color="#0a7369"/>
    </linearGradient>
  </defs>

  <!-- backdrop -->
  <circle cx="200" cy="160" r="130" fill="url(#cb-blob)" opacity="0.12"/>

  <!-- chat bubbles -->
  <g>
    <rect x="60" y="78" width="116" height="48" rx="18" fill="#fff" stroke="#E6E1FB" stroke-width="2"/>
    <path d="M76 122l-2 18 20 -14Z" fill="#fff" stroke="#E6E1FB" stroke-width="2"/>
    <circle cx="92" cy="102" r="6" fill="#7C3AED" opacity="0.7"/>
    <circle cx="112" cy="102" r="6" fill="#6366F1" opacity="0.7"/>
    <circle cx="132" cy="102" r="6" fill="#0D9488" opacity="0.7"/>
  </g>
  <g>
    <rect x="248" y="208" width="104" height="44" rx="16" fill="#7C3AED"/>
    <path d="M336 248l4 16 -20 -12Z" fill="#7C3AED"/>
    <rect x="266" y="223" width="52" height="6" rx="3" fill="#fff" opacity="0.85"/>
    <rect x="266" y="234" width="34" height="6" rx="3" fill="#fff" opacity="0.6"/>
  </g>

  <!-- robot antenna -->
  <line x1="200" y1="96" x2="200" y2="118" stroke="#6366F1" stroke-width="5" stroke-linecap="round"/>
  <circle cx="200" cy="90" r="9" fill="#34d399"/>

  <!-- robot head capsule -->
  <rect x="138" y="116" width="124" height="120" rx="40" fill="url(#cb-body)"/>
  <rect x="150" y="118" width="100" height="40" rx="22" fill="#fff" opacity="0.18"/>

  <!-- face screen -->
  <rect x="160" y="146" width="80" height="58" rx="22" fill="#0a3f3a"/>
  <circle cx="184" cy="174" r="9" fill="#34d399"/>
  <circle cx="216" cy="174" r="9" fill="#34d399"/>
  <path d="M182 192c8 7 28 7 36 0" stroke="#34d399" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- ears -->
  <rect x="124" y="160" width="16" height="34" rx="8" fill="#6366F1"/>
  <rect x="260" y="160" width="16" height="34" rx="8" fill="#6366F1"/>

  <!-- plus / sparkle accents -->
  <g fill="#7C3AED" opacity="0.55">
    <path d="M306 120h10v6h-10v10h-6v-10h-10v-6h10v-10h6Z"/>
  </g>
  <circle cx="92" cy="206" r="9" fill="#34d399" opacity="0.8"/>
  <path d="M312 168l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3Z" fill="#6366F1" opacity="0.6"/>
</svg>
