<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DoseBot — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="assets/dosebot_pill_avatar.png">

  <!-- Firebase compat SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Loading screen -->
<div id="appLoader">
  <div class="loader-ring"></div>
  <p class="loader-text">Loading DoseBot…</p>
</div>

<!-- Toast container -->
<div class="toast-wrap" id="toastWrap"></div>

<!-- Background geo shapes -->
<div class="auth-geos" aria-hidden="true">
  <svg class="auth-geo ag-1" viewBox="0 0 60 60"><circle cx="30" cy="30" r="28" fill="none" stroke="currentColor" stroke-width="2"/></svg>
  <svg class="auth-geo ag-2" viewBox="0 0 60 52"><polygon points="30,2 58,50 2,50" fill="none" stroke="currentColor" stroke-width="2"/></svg>
  <svg class="auth-geo ag-3" viewBox="0 0 60 60"><polygon points="30,2 56,17 56,43 30,58 4,43 4,17" fill="none" stroke="currentColor" stroke-width="2"/></svg>
  <svg class="auth-geo ag-4" viewBox="0 0 60 60"><rect x="8" y="8" width="44" height="44" rx="8" fill="none" stroke="currentColor" stroke-width="2"/></svg>
</div>

<main class="auth-page">
  <div class="auth-card">

    <!-- Logo -->
    <div class="auth-logo">
      <div class="auth-brand-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <rect x="3" y="11" width="18" height="11" rx="2" fill="white" opacity="0.25"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
          <circle cx="12" cy="16" r="2.2" fill="white"/>
        </svg>
      </div>
      <span class="auth-brand-name">DoseBot</span>
    </div>

    <p class="auth-google-sub">Sign in with your Google account to continue to DoseBot.</p>

    <div class="auth-form-wrap" id="loginForm">
      <button class="google-btn" id="googleSignInBtn" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Continue with Google
      </button>

      <div class="auth-error" id="loginError" role="alert"></div>
    </div>

    <a href="../index.html" class="auth-back-link">← Back to homepage</a>
  </div>
</main>

<script src="auth.js"></script>
</body>
</html>
